name: Release

# Tag a version (git tag v1.2.0 && git push --tags): builds the client, publishes it with the release, and
# updates the VPS. Needs the repository secrets VPS_HOST, VPS_USER and VPS_SSH_KEY.
on:
  push:
    tags: ["v*"]

jobs:
  client:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild may-khach/ung-dung/Hue_travel.csproj /restore /p:Configuration=Release /v:minimal
      - name: Zip the client (the Windows installer is built on a machine that has MapWinGIS, see may-khach/bo-cai/README.md)
        run: Compress-Archive -Path may-khach/ung-dung/bin/Release/* -DestinationPath CoDoGIS-${{ github.ref_name }}-portable.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: CoDoGIS-${{ github.ref_name }}-portable.zip

  deploy:
    runs-on: ubuntu-latest
    needs: client
    steps:
      - name: Update the VPS
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER_NAME@$HOST" 'cd /opt/hue-travel/may-chu && scripts/deploy.sh update'
